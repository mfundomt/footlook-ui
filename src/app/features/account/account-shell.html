<div class="shell">
  <header class="bar">
    <a class="brand" routerLink="/" aria-label="FootLook home">
      <img src="assets/logo-transparent.png" alt="" width="105" height="88" />
      <span>FootLook</span>
    </a>

    <nav aria-label="Account">
      <a routerLink="/projects" routerLinkActive="active" ariaCurrentWhenActive="page">Projects</a>
      <a routerLink="/join" routerLinkActive="active" ariaCurrentWhenActive="page">Join</a>
    </nav>

    <div class="who">
      @if (user(); as u) {
        <span class="name" [attr.title]="u.email">{{ u.displayName || u.email }}</span>
      }
      <button type="button" class="signout" (click)="signOut()">Sign out</button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <router-outlet />
  </main>
</div>
